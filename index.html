<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f2">
  <title>Little Things — To-do list</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --page: #f7f6f2;
      --surface: #fff;
      --surface-soft: #fbfaf8;
      --ink: #252522;
      --muted: #898780;
      --line: #eae8e2;
      --accent: #7562d8;
      --accent-soft: #f0edff;
      --danger: #c65e5e;
      --shadow: 0 18px 55px rgb(42 37 25 / 7%), 0 2px 8px rgb(42 37 25 / 3%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #171719;
        --surface: #222225;
        --surface-soft: #29292d;
        --ink: #f2f0eb;
        --muted: #aaa7a0;
        --line: #38383c;
        --accent: #a99af7;
        --accent-soft: #332e4a;
        --danger: #ed9999;
        --shadow: 0 18px 55px rgb(0 0 0 / 24%), 0 2px 8px rgb(0 0 0 / 15%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 72px 22px 48px;
      background:
        radial-gradient(ellipse at 50% 0%, rgb(222 214 255 / 27%), transparent 48%),
        var(--page);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.5;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(100%, 480px);
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      letter-spacing: .075em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 10px;
      background: var(--accent);
      color: white;
    }

    .brand-mark svg { width: 17px; height: 17px; }

    .heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 38px);
      font-weight: 680;
      letter-spacing: -.055em;
      line-height: 1.12;
    }

    .date {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .count-pill {
      flex: 0 0 auto;
      margin-bottom: 3px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .card {
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .task-list {
      min-height: 68px;
      margin: 0;
      padding: 7px 20px 2px;
      list-style: none;
    }

    .filters {
      display: flex;
      gap: 5px;
      padding: 14px 20px 0;
    }

    .filter-button {
      padding: 5px 10px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .filter-button[aria-pressed="true"] {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .task {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 62px;
      border-bottom: 1px solid var(--line);
      animation: arrive 220ms ease both;
    }

    .task:last-child { border-bottom: 0; }
    .task.is-dragging { opacity: .45; }
    .task.drop-before { box-shadow: inset 0 2px var(--accent); }
    .task.drop-after { box-shadow: inset 0 -2px var(--accent); }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task-details { display: flex; min-width: 0; flex: 1; flex-direction: column; padding: 10px 0; }

    .check {
      display: grid;
      flex: 0 0 auto;
      width: 21px;
      height: 21px;
      padding: 0;
      place-items: center;
      border: 1.6px solid #cbc8c1;
      border-radius: 7px;
      background: transparent;
      color: white;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease, transform 180ms cubic-bezier(.2,.8,.2,1.4);
    }

    .check:hover { border-color: var(--accent); transform: scale(1.07); }
    .check:active { transform: scale(.9); }
    .check svg { width: 13px; height: 13px; opacity: 0; transform: scale(.5); transition: opacity 150ms ease, transform 180ms ease; }
    .task.is-done .check { border-color: var(--accent); background: var(--accent); }
    .task.is-done .check svg { opacity: 1; transform: scale(1); }

    .task-text {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      font-size: 15px;
      transition: color 180ms ease;
    }

    .task.is-done .task-text { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }

    .task-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 8px;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .due-label.is-overdue { color: var(--danger); }

    .due-date-input {
      width: 112px;
      min-width: 0;
      padding: 2px 3px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
    }

    .due-date-control { display: flex; align-items: center; gap: 4px; }
    .due-date-input:hover, .due-date-input:focus-visible { border-color: var(--line); }

    .order-controls { display: flex; flex: 0 0 auto; }

    .order-button, .drag-handle {
      display: grid;
      width: 27px;
      height: 32px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .order-button:disabled { visibility: hidden; }
    .order-button:hover, .drag-handle:hover { background: var(--surface-soft); color: var(--ink); }
    .order-button svg, .drag-handle svg { width: 15px; height: 15px; }
    .drag-handle { cursor: grab; }
    .drag-handle:active { cursor: grabbing; }

    .delete {
      display: grid;
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      place-items: center;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      opacity: 0;
      transition: background 150ms ease, color 150ms ease, opacity 150ms ease;
    }

    .task:hover .delete, .delete:focus-visible { opacity: 1; }
    .delete:hover { background: color-mix(in srgb, var(--danger) 11%, transparent); color: var(--danger); }
    .delete svg { width: 16px; height: 16px; }

    .add-form {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 20px;
      padding: 17px 0 18px;
      border-top: 1px solid var(--line);
    }

    .add-plus {
      display: grid;
      width: 21px;
      height: 21px;
      flex: 0 0 auto;
      place-items: center;
      border: 1.5px solid var(--accent);
      border-radius: 7px;
      color: var(--accent);
    }

    .add-plus svg { width: 13px; height: 13px; }

    .add-input {
      width: 100%;
      min-width: 0;
      padding: 3px 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
    }

    .add-input::placeholder { color: var(--muted); opacity: .9; }
    .add-form:focus-within .add-plus { background: var(--accent-soft); }

    .add-button {
      flex: 0 0 auto;
      padding: 7px 12px;
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: filter 150ms ease, transform 150ms ease;
    }

    .add-button:hover { filter: brightness(1.08); }
    .add-button:active { transform: scale(.96); }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 15px 3px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .clear-button {
      padding: 4px 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      transition: color 150ms ease;
    }

    .clear-button:hover { color: var(--danger); }
    .clear-button:disabled { visibility: hidden; }

    .empty-filter {
      padding: 22px 4px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    button:focus-visible, input:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
      outline-offset: 3px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    @media (max-width: 480px) {
      body { padding: 44px 18px 32px; }
      .brand { margin-bottom: 28px; }
      .task-list { padding-right: 16px; padding-left: 16px; }
      .filters { padding-right: 16px; padding-left: 16px; }
      .add-form { margin-right: 16px; margin-left: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/><path d="M12 3v2M5.6 5.6 7 7M3 12h2"/></svg>
      </span>
      Little things
    </div>
    <header class="heading">
      <div>
        <h1>My tasks</h1>
        <p class="date" id="today"></p>
      </div>
      <span class="count-pill" id="task-count" aria-live="polite"></span>
    </header>
    <section class="card" aria-label="To-do list">
      <nav class="filters" aria-label="Filter tasks">
        <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </nav>
      <ul class="task-list" id="task-list" aria-live="polite"></ul>
      <form class="add-form" id="add-form">
        <span class="add-plus" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>
        </span>
        <label class="sr-only" for="new-task">Add a task</label>
        <input class="add-input" id="new-task" name="task" type="text" maxlength="160" placeholder="Add a task..." autocomplete="off">
        <button class="add-button" type="submit">Add task</button>
      </form>
    </section>
    <footer class="footer">
      <span id="progress"></span>
      <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
    </footer>
    <span class="sr-only" id="task-announcement" aria-live="polite"></span>
  </main>
  <script>
    (() => {
      const STORAGE_KEY = "little-things-tasks-v1";
      const examples = [
        { id: "sample-1", text: "Plan the week and set a few priorities", done: false, dueDate: "" },
        { id: "sample-2", text: "Take a proper lunch break", done: true, dueDate: "" },
        { id: "sample-3", text: "Pick up a few groceries on the way home", done: false, dueDate: "" }
      ];

      const list = document.querySelector("#task-list");
      const form = document.querySelector("#add-form");
      const input = document.querySelector("#new-task");
      const count = document.querySelector("#task-count");
      const progress = document.querySelector("#progress");
      const clearButton = document.querySelector("#clear-completed");
      const announcement = document.querySelector("#task-announcement");
      const filterButtons = [...document.querySelectorAll(".filter-button")];
      let tasks = loadTasks();
      let activeFilter = "all";
      let draggedTaskId = null;

      document.querySelector("#today").textContent = new Intl.DateTimeFormat(undefined, {
        weekday: "long", month: "long", day: "numeric"
      }).format(new Date());

      function loadTasks() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved === null) return examples;
          const parsed = JSON.parse(saved);
          if (!Array.isArray(parsed)) throw new Error("Saved tasks are not a list.");
          return parsed.filter(task =>
            task && typeof task.id === "string" &&
            typeof task.text === "string" && typeof task.done === "boolean"
          ).map(task => ({
            ...task,
            dueDate: isValidDate(task.dueDate) ? task.dueDate : ""
          }));
        } catch (error) {
          console.error("Could not load saved tasks:", error);
          return examples;
        }
      }

      function isValidDate(value) {
        if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
        const [year, month, day] = value.split("-").map(Number);
        const date = new Date(year, month - 1, day);
        return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day;
      }

      function todayString() {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
      }

      function formatDate(value) {
        const [year, month, day] = value.split("-").map(Number);
        return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", year: "numeric" })
          .format(new Date(year, month - 1, day));
      }

      function visibleTasks() {
        return tasks.filter(task =>
          activeFilter === "all" ||
          (activeFilter === "active" && !task.done) ||
          (activeFilter === "completed" && task.done)
        );
      }

      function reorderVisible(sourceId, targetId, after = false) {
        if (sourceId === targetId) return false;
        const visible = visibleTasks();
        const sourceIndex = visible.findIndex(task => task.id === sourceId);
        const targetIndex = visible.findIndex(task => task.id === targetId);
        if (sourceIndex < 0 || targetIndex < 0) return false;
        const reordered = [...visible];
        const [source] = reordered.splice(sourceIndex, 1);
        let insertionIndex = reordered.findIndex(task => task.id === targetId);
        if (after) insertionIndex++;
        reordered.splice(insertionIndex, 0, source);
        const visibleSlots = tasks.map((task, index) => visible.some(item => item.id === task.id) ? index : -1).filter(index => index >= 0);
        visibleSlots.forEach((slot, index) => { tasks[slot] = reordered[index]; });
        return true;
      }

      function moveTask(taskId, direction) {
        const visible = visibleTasks();
        const index = visible.findIndex(task => task.id === taskId);
        const target = visible[index + direction];
        if (!target || !reorderVisible(taskId, target.id, direction > 0)) return;
        saveTasks();
        render();
        announcement.textContent = `Moved ${visible[index].text} ${direction < 0 ? "up" : "down"}.`;
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (error) {
          console.error("Could not save tasks to localStorage:", error);
          progress.textContent = "Could not save changes in this browser";
        }
      }

      function render() {
        list.replaceChildren();
        const shownTasks = visibleTasks();
        if (shownTasks.length === 0 && tasks.length > 0) {
          const empty = document.createElement("li");
          empty.className = "empty-filter";
          empty.textContent = activeFilter === "active" ? "No active tasks" : "No completed tasks";
          list.append(empty);
        }
        for (const [index, task] of shownTasks.entries()) {
          const row = document.createElement("li");
          row.className = `task${task.done ? " is-done" : ""}`;
          row.dataset.taskId = task.id;

          const toggle = document.createElement("button");
          toggle.className = "check";
          toggle.type = "button";
          toggle.setAttribute("aria-label", `${task.done ? "Mark as not done" : "Complete"}: ${task.text}`);
          toggle.setAttribute("aria-pressed", String(task.done));
          toggle.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 8 3 3 6-6"/></svg>';
          toggle.addEventListener("click", () => {
            task.done = !task.done;
            saveTasks();
            render();
          });

          const text = document.createElement("span");
          text.className = "task-text";
          text.textContent = task.text;

          const details = document.createElement("div");
          details.className = "task-details";
          details.append(text);

          const dateInput = document.createElement("input");
          dateInput.className = "due-date-input";
          dateInput.type = "date";
          dateInput.value = task.dueDate || "";
          dateInput.setAttribute("aria-label", `Due date for ${task.text}`);
          dateInput.addEventListener("change", () => {
            task.dueDate = isValidDate(dateInput.value) ? dateInput.value : "";
            saveTasks();
            render();
          });
          const meta = document.createElement("div");
          meta.className = "task-meta";
          const dateControl = document.createElement("label");
          dateControl.className = "due-date-control";
          dateControl.append("Due", dateInput);
          meta.append(dateControl);

          if (task.dueDate) {
            const overdue = !task.done && task.dueDate < todayString();
            const dueLabel = document.createElement("span");
            dueLabel.className = `due-label${overdue ? " is-overdue" : ""}`;
            dueLabel.textContent = `${overdue ? "Overdue · " : "Due "}${formatDate(task.dueDate)}`;
            meta.append(dueLabel);
          }
          details.append(meta);

          const orderControls = document.createElement("span");
          orderControls.className = "order-controls";

          const moveUp = document.createElement("button");
          moveUp.className = "order-button";
          moveUp.type = "button";
          moveUp.disabled = index === 0;
          moveUp.setAttribute("aria-label", `Move up: ${task.text}`);
          moveUp.innerHTML = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5-5 5 5"/></svg>';
          moveUp.addEventListener("click", () => moveTask(task.id, -1));

          const moveDown = document.createElement("button");
          moveDown.className = "order-button";
          moveDown.type = "button";
          moveDown.disabled = index === shownTasks.length - 1;
          moveDown.setAttribute("aria-label", `Move down: ${task.text}`);
          moveDown.innerHTML = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 5 5 5-5"/></svg>';
          moveDown.addEventListener("click", () => moveTask(task.id, 1));

          const dragHandle = document.createElement("button");
          dragHandle.className = "drag-handle";
          dragHandle.type = "button";
          dragHandle.draggable = true;
          dragHandle.setAttribute("aria-label", `Drag to reorder: ${task.text}. Use move up and move down buttons as an alternative.`);
          dragHandle.innerHTML = '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><circle cx="7" cy="5" r="1.2"/><circle cx="13" cy="5" r="1.2"/><circle cx="7" cy="10" r="1.2"/><circle cx="13" cy="10" r="1.2"/><circle cx="7" cy="15" r="1.2"/><circle cx="13" cy="15" r="1.2"/></svg>';
          dragHandle.addEventListener("dragstart", event => {
            draggedTaskId = task.id;
            row.classList.add("is-dragging");
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", task.id);
          });
          dragHandle.addEventListener("dragend", () => {
            draggedTaskId = null;
            list.querySelectorAll(".task").forEach(item => item.classList.remove("is-dragging", "drop-before", "drop-after"));
          });

          const remove = document.createElement("button");
          remove.className = "delete";
          remove.type = "button";
          remove.setAttribute("aria-label", `Delete: ${task.text}`);
          remove.innerHTML = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4.5 6h11M8 6V4.5h4V6m2.5 0-.6 10H6.1L5.5 6m2.8 3v4m3.4-4v4"/></svg>';
          remove.addEventListener("click", () => {
            tasks = tasks.filter(item => item.id !== task.id);
            saveTasks();
            render();
          });

          orderControls.append(moveUp, moveDown, dragHandle);
          row.append(toggle, details, orderControls, remove);
          list.append(row);
        }

        const remaining = tasks.filter(task => !task.done).length;
        const completed = tasks.length - remaining;
        count.textContent = `${remaining} ${remaining === 1 ? "task" : "tasks"} left`;
        progress.textContent = tasks.length
          ? `${completed} of ${tasks.length} completed`
          : "A little space to start fresh";
        clearButton.disabled = completed === 0;
        filterButtons.forEach(button => {
          button.setAttribute("aria-pressed", String(button.dataset.filter === activeFilter));
        });
      }

      filterButtons.forEach(button => button.addEventListener("click", () => {
        activeFilter = button.dataset.filter;
        render();
      }));

      list.addEventListener("dragover", event => {
        if (!draggedTaskId) return;
        const row = event.target.closest(".task");
        if (!row || row.dataset.taskId === draggedTaskId) return;
        event.preventDefault();
        const bounds = row.getBoundingClientRect();
        const after = event.clientY > bounds.top + bounds.height / 2;
        list.querySelectorAll(".task").forEach(item => item.classList.remove("drop-before", "drop-after"));
        row.classList.add(after ? "drop-after" : "drop-before");
        event.dataTransfer.dropEffect = "move";
      });

      list.addEventListener("drop", event => {
        const row = event.target.closest(".task");
        if (!draggedTaskId || !row) return;
        event.preventDefault();
        const bounds = row.getBoundingClientRect();
        const after = event.clientY > bounds.top + bounds.height / 2;
        if (reorderVisible(draggedTaskId, row.dataset.taskId, after)) {
          saveTasks();
          render();
          announcement.textContent = "Task order updated.";
        }
      });

      form.addEventListener("submit", event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) {
          input.focus();
          return;
        }
        tasks.push({ id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`, text, done: false, dueDate: "" });
        input.value = "";
        saveTasks();
        render();
        input.focus();
      });

      clearButton.addEventListener("click", () => {
        tasks = tasks.filter(task => !task.done);
        saveTasks();
        render();
      });

      render();
    })();
  </script>
</body>
</html>
